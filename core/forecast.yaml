# Налаштування прогнозу заповнення диска (core/forecast.py).
#
# Прогноз універсальний: він бачить лише ряд «зайнятість диска, %» (і вільні ГБ)
# з metrics_clean. Тут немає жодних серверів, тек, годин бекапу тощо —
# усе, що «регулярне», знаходиться в самих даних.

method: linear            # робочий метод: linear; naive_last / naive_daily — лише для порівняння
threshold_pct: 90         # поріг: прогноз рахує час до цього рівня
history_days: 14          # скільки днів історії бере прогноз

# Різка зміна (сходинка): за кожні 10 хв рівень змінюється щонайменше на
# step_rate_pp п. п., а разом — щонайменше на step_min_pp п. п. не довше
# за step_max_min хв. Підйом — стрибок (бекап, тимчасовий файл),
# падіння — прибирання / видалення.
steps:
  bin_min: 10
  step_rate_pp: 0.5
  step_min_pp: 3
  step_max_min: 60

# Питання 1. Тренд: пряма через погодинні дані від останнього різкого падіння
trend:
  min_hours: 6            # менше даних після падіння — «мало даних»
  max_hours_to_threshold: 8760   # далі за рік — «не досягне»

# Питання 2. Незвичний ріст: пряма через останні window_min хвилин
fast_growth:
  window_min: 90
  baseline_days: 7        # «зазвичай у цю годину» — ті самі хвилини за 7 попередніх днів
  factor: 3               # незвичний — утричі швидший за звичайний (90-й перцентиль)...
  min_pct_per_h: 1.0      # ...і не повільніший за 1 % на годину

# Питання 3. Регулярний стрибок: підйоми приблизно в той самий час доби
# і того самого розміру (ГБ) щонайменше в min_days різні дні за lookback_days
jump:
  lookback_days: 7
  min_days: 3
  time_tolerance_min: 90
  size_tolerance: 0.3     # ± 30 % розміру
  max_pair_hours: 24      # видалення «пари» стрибка шукаємо не пізніше ніж через 24 год
