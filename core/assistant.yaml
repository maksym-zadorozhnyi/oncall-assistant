# Параметри ядра асистента (core/assistant.py) — як forecast.yaml для прогнозу.
#
# temperature немає свідомо: claude-haiku-5-5 відповідає помилкою 400 на будь-яку
# нестандартну температуру, а бібліотека anthropic 2.x цього параметра не приймає
# зовсім. Тому іспит не повністю відтворюваний — стабільність міряємо 3 прогонами.

model: claude-haiku-5-5
effort: low                 # low / medium / high — скільки модель «обдумує»; на етапі 3 порівнюємо low і medium
max_tokens: 4000            # запобіжник: «обдумування» теж витрачає цей ліміт; довжину відповіді задає промпт
max_tool_rounds: 6          # скільки разів за питання LLM може просити функції
history_messages: 8         # скільки останніх реплік пам'ятати (лише текст + рядок «Дивився: …»)
tool_result_max_kb: 12      # довший JSON обрізається: найдовший список, з приміткою «показано N з M»
timeout_s: 60               # тайм-аут одного виклику API
max_retries: 2              # повтори при 429 / 5xx / обриві зв'язку (робить сама бібліотека)

# Параметри функцій, які ставить код (LLM їх не бачить і не передає)
hidden_args:
  get_metric_history: {max_points: 50}
  get_disk_forecast: {with_line: false}
