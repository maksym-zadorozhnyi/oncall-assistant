# Налаштування Streamlit для дашборду (web/app.py).
# Streamlit читає цей файл сам, якщо запускати з кореня проєкту: streamlit run web/app.py

[server]
# Слухати лише цей комп'ютер (localhost). Без цього рядка дашборд доступний
# з усієї мережі, а пароля поки немає (крок 4.5).
address = "127.0.0.1"
port = 8501
# Не відкривати браузер і не питати e-mail при першому запуску
headless = true

[browser]
# Не надсилати статистику використання в Streamlit
gatherUsageStats = false
